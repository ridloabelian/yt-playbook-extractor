[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-playbook-extractor"
version = "0.1.0"
description = "Turn any YouTube creator's videos, external podcasts & Shorts into an attributed, timestamped Playbook via multimodal Gemini REST URI ingestion"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
yt-playbook = "yt_playbook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
